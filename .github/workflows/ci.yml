name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          sudo apt-get install -y tidy
          tidy -e -q frontend/index.html || true

      - name: Check PHP Syntax
        run: |
          find backend -name "*.php" -exec php -l {} \;

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t portfolio-frontend ./frontend

      - name: Build Backend Docker Image
        run: docker build -t portfolio-backend ./backend

  test-api:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start Backend Container
        run: |
          docker build -t portfolio-backend ./backend
          docker run -d -p 8081:80 --name backend portfolio-backend
          sleep 5

      - name: Test API Endpoints
        run: |
          curl -f http://localhost:8081/index.php
          curl -f http://localhost:8081/api/tech-stack.php
          curl -f http://localhost:8081/api/projects.php

      - name: Cleanup
        run: docker rm -f backend
