name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          sudo apt-get install -y tidy
          tidy -e -q frontend/index.html || true

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Test Hono.js Server
        run: |
          timeout 10s npm start &
          sleep 3
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/api/projects
          curl -f http://localhost:3000/api/tech-stack
        working-directory: backend

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t portfolio-frontend ./frontend

      - name: Build Backend Docker Image
        run: docker build -t portfolio-backend ./backend
