name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Legal contact data from secret (optional)
        working-directory: frontend
        env:
          LEGAL_CONTACT_JSON: ${{ secrets.LEGAL_CONTACT_JSON }}
        run: |
          if [ -n "$LEGAL_CONTACT_JSON" ]; then
            printf '%s' "$LEGAL_CONTACT_JSON" > src/data/legal.local.json
            echo "legal.local.json written from secret."
          else
            echo "::warning::Secret LEGAL_CONTACT_JSON is missing - Impressum will deploy without a postal address."
          fi

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Deploy to Cloudflare Workers
        run: node ./node_modules/wrangler/bin/wrangler.js deploy --config wrangler.jsonc
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
